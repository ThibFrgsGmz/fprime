# --exclude=docs/* --exclude=Autocoders/* --exclude=cmake/* --exclude=FppTest/* --exclude=STest/* --extensions=c,cpp,h,hpp $( find . -name \*.hpp -or -name \*.cpp | grep -vE "^\.\/build\/" ) 2>&1 |
